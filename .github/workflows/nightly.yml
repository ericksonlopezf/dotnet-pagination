name: Nightly Deep Validation

on:
  schedule:
    # Runs daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mutation-level:
        description: "Stryker mutation level (Standard, Advanced)"
        required: false
        default: "Advanced"
        type: choice
        options:
          - Standard
          - Advanced

concurrency:
  group: nightly-deep-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  deep-validation:
    name: Deep Analysis & Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore Strong Name key
        env:
          SNK_KEY: ${{ secrets.SNK_KEY }}
        run: |
          if [ -n "$SNK_KEY" ]; then
            echo "$SNK_KEY" | tr -d '\n\r ' | base64 --decode > EricksonLopez.snk
          fi

      - name: Verify Architecture & Compliance
        shell: pwsh
        run: ./scripts/verify-compliance.ps1 -SkipTests

      - name: Run Full Test Suite (Unit & Integration)
        run: dotnet test EricksonLopez.Pagination.slnx --configuration Release --verbosity normal

      - name: Verify Benchmark Gate
        shell: pwsh
        run: ./scripts/verify-benchmark-gate.ps1 -Configuration Release

  nightly-mutation:
    name: Nightly Full Mutation Testing
    needs: deep-validation
    permissions:
      contents: write
      statuses: write
      actions: read
    uses: ./.github/workflows/mutation-testing.yml
    with:
      mutation-level: ${{ inputs.mutation-level || 'Advanced' }}
    secrets: inherit
