name: NativeAOT Smoke Test

# ─── Purpose ────────────────────────────────────────────────────────────────
# This workflow validates that EricksonLopez.Pagination packages are genuinely
# NativeAOT-compatible, not just declared as such via IsAotCompatible=true.
#
# The smoke test:
#   1. Restores and builds the solution in Release mode.
#   2. Publishes the AotTest console app with PublishAot=true.
#   3. Runs the published native binary and asserts a zero exit code.
# ────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    secrets:
      SNK_KEY:
        description: "Base64-encoded Strong Name key (.snk) for assembly signing"
        required: false
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  aot-smoke-test:
    name: NativeAOT Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore Strong Name key
        env:
          SNK_KEY: ${{ secrets.SNK_KEY }}
        run: |
          if [ -n "$SNK_KEY" ]; then
            echo "$SNK_KEY" | tr -d '\n\r ' | base64 --decode > EricksonLopez.snk
          fi

      - name: Install NativeAOT prerequisites (clang, lld, zlib)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld zlib1g-dev

      - name: Restore dependencies
        run: dotnet restore EricksonLopez.Pagination.slnx

      - name: Build (Release)
        run: dotnet build EricksonLopez.Pagination.slnx --no-restore --configuration Release

      - name: Publish AotSmokeTest (NativeAOT)
        run: >
          dotnet publish
          tests/EricksonLopez.Pagination.AotSmokeTest/EricksonLopez.Pagination.AotSmokeTest.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained
          -p:PublishAot=true
          -p:TargetFramework=net10.0
          --output ./aot-output

      - name: Run NativeAOT binary
        run: |
          chmod +x ./aot-output/EricksonLopez.Pagination.AotSmokeTest
          ./aot-output/EricksonLopez.Pagination.AotSmokeTest
          echo "Exit code: $?"

      - name: Upload AOT artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aot-output-${{ github.run_id }}
          path: ./aot-output/
          retention-days: 7
